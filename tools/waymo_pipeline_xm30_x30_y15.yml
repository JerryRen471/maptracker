paths:
  conda_home: /root/miniconda3
  waymo_env: waymo_pack
  train_env: maptracker
  waymo_train_dir: /data8012/waymo/training
  waymo_val_dir: /data8012/waymo/validation
  processed_dir: /data/waymo_processed_xm30_x30_y15
  maptracker_dir: /data/waymo_maptracker_xm30_x30_y15
  work_root: /data/maptr_workspace/work_dirs
  reuse_images_from: ""
  mmdet3d_dir: null
  extra_pythonpath: []

roi:
  x_min: -30
  y_min: -15
  x_max: 30
  y_max: 15

convert:
  frame_stride: 5
  num_points: 20
  num_workers: 8

runtime:
  gpus: "0,1,2,3"
  num_gpus: 4
  exp_tag: xm30_x30_y15
  dry_run: false
  init_ckpt: null

generated_configs:
  enabled: true
  out_dir: null
  overwrite: true
  schedule:
    auto_from_data: true
    num_epochs: 20
    num_iters_per_epoch: null
    min_iters_per_epoch: 1
    update_evaluation: true
    update_checkpoint: true
    adjust_warmup: true
    warmup_ratio: 0.1

subset:
  enabled: true
  output_dir: /data/waymo_maptracker_xm30_x30_y15_overfit6
  num_scenes: 6
  scenes: []

visualize:
  scene_ids: []
  per_frame_result: 1
  overwrite: 1
  draw_bev_range: true
  semantic:
    enabled: true
    stage: stage1
    split: val
    out_dir: null
    max_frames: 24
    workers_per_gpu: 0
    device_id: 0
    score_dpi: 140
    score_heatmaps: true
